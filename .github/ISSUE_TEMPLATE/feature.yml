name: Feature request
description: Propose a user-facing capability or engineering improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What task or problem should AirControl solve?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected behavior
      description: Describe the behavior and relevant safety conditions.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: What can be automated, and what needs a Windows device?
    validations:
      required: true
