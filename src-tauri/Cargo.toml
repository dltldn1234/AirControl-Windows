[package]
name = "aircontrol-windows"
version = "0.1.0"
description = "Local-first Windows hand gesture control"
authors = ["dltldn1234"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aircontrol_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = ["crates/aircontrol-core"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aircontrol-core = { path = "crates/aircontrol-core" }
log = "0.4"
tauri-plugin-log = "2"
tempfile = "3"
nokhwa = { version = "0.10.11", features = ["input-native"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.22"
ort = { version = "2.0.0-rc.15", default-features = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
